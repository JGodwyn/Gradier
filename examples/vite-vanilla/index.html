<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradier – vanilla example</title>
  </head>
  <body>
    <gradier-gradient name="hero" class="hero">
      <div>
        <h1>Gradier</h1>
        <p>Press <kbd>Alt+G</kbd> or click the button bottom-right to edit these gradients.</p>
      </div>

    <section class="cards">
      <gradier-gradient name="card" class="card">Animated card</gradier-gradient>
      <gradier-gradient name="card" class="card">Same gradient, reused</gradier-gradient>
      <gradier-gradient name="footer" class="card">Not created yet – click its label</gradier-gradient>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
